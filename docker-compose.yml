version: "3.9"
services:
  bot:
    image: node:24
    user: "node"
    working_dir: /home/node/app
    volumes:
      - ./public/:/home/node/app/public
      - .:/home/node/app
    command: npm start
    env_file:
      - .env
    depends_on:
      - search
  http:
    image: ghcr.io/testausserveri/arm64v8-apache2:latest
    volumes:
      - ./public/:/var/www/html/
      - ./apache-vhost.conf:/etc/apache2/sites-enabled/000-default.conf
    command: sh -c "a2enmod proxy proxy_http && apachectl -D FOREGROUND"
    ports:
      - ${HTTP_PORT:-8080}:80
    depends_on:
      - search
  qdrant:
    image: qdrant/qdrant:latest
    restart: always
    volumes:
      - ./data/qdrant:/qdrant/storage
    expose:
      - "6333"
  search:
    build:
      context: .
      dockerfile: Dockerfile.search
    image: kaatis-search:local
    restart: always
    user: "node"
    working_dir: /home/node/app
    volumes:
      - ./public/:/home/node/app/public
      - .:/home/node/app
    environment:
      QDRANT_URL: http://qdrant:6333
    env_file:
      - .env
    command: npm run search:start
    depends_on:
      - qdrant
    ports:
      - 127.0.0.1:${SEARCH_HOST_PORT:-3095}:3000
